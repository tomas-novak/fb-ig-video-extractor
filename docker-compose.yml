# Self-hosted nasazení (VPS, NAS, Raspberry Pi):
#   1. zkopíruj .env.example na .env a vyplň klíče (PUBLIC_URL zatím nech prázdné)
#   2. docker compose up -d
#   3. teprve až před kontejnerem funguje HTTPS (vlastní reverse proxy),
#      nastav PUBLIC_URL na veřejnou adresu instance a spusť
#      `docker compose up -d` znovu (bot registruje webhook při každém
#      startu - nastavit ho dřív jen nahromadí neúspěšná doručení)
services:
  bot:
    build: .
    env_file: .env
    environment:
      - PORT=8000
      # Přebíjí HOST z .env: v kontejneru se musí poslouchat na všech
      # rozhraních, jinak by mapování portu níže nefungovalo. Hodnota
      # HOST=127.0.0.1 (pro nasazení za reverse proxy) sem nepatří.
      - HOST=0.0.0.0
    ports:
      - "8000:8000"
    restart: unless-stopped
