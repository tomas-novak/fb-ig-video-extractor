# Self-hosted deployment behind caddy-docker-proxy:
#   1. copy .env.example to .env and fill in the keys (leave PUBLIC_URL empty for now)
#   2. docker compose up -d
#   3. once HTTPS works (caddy-docker-proxy issues the cert automatically),
#      set PUBLIC_URL=https://extractor.kozliatko.sk in .env and run
#      `docker compose up -d` again (the bot registers the webhook on every
#      startup - setting it earlier only piles up failed deliveries)
services:
  bot:
    build: .
    env_file: .env
    environment:
      - PORT=8000
      # Overrides HOST from .env: inside a container it must listen on all
      # interfaces, otherwise the reverse proxy upstream would not work. The
      # value HOST=127.0.0.1 does not belong here.
      - HOST=0.0.0.0
    networks:
      - default
      - caddy
    volumes:
      # Cached map-popup thumbnails - must survive rebuilds/recreates, so it
      # cannot live in the container's own (ephemeral) filesystem.
      - thumbnails:/app/data/thumbnails
    labels:
      caddy: extractor.kozliatko.sk
      caddy.reverse_proxy: "{{upstreams 8000}}"
    restart: unless-stopped

networks:
  caddy:
    external: true

volumes:
  thumbnails:
