# Configuration for deploying to Railway (railway.com). It is detected
# automatically when this repo is connected as a Railway project. Alternatives:
# your own VPS (docs/deploy-vps.md) or Docker (docker-compose.yml) - see README.

[build]
builder = "nixpacks"

[deploy]
startCommand = "python main.py"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
